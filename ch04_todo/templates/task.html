<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .completed {
            text-decoration: line-through;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center">Todo List</h1>
        <form action="/add" method="POST" class="mt-4">
            <div class="input-group">
                <input type="text" class="form-control" name="title" placeholder="Enter task">
                <div class="input-group-append">
                    <button type="submit" class="btn btn-primary">Add Task</button>
                </div>
            </div>
        </form>
        <ul class="list-group mt-4">
            {% for task in tasks %}
                <li class="list-group-item">
                    <span class="{% if task[2]=='true' %}completed{% endif %}">
                        {{ task[1] }}
                    </span>
			<button type="button" class="btn btn-success btn-sm ml-2"
        			onclick="fetch('/complete/{{ task[0] }}', { method: 'PATCH' }).then(() => location.reload())">
    			Complete
			</button>
			<button type="button" class="btn btn-danger btn-sm ml-2"
        			onclick="fetch('/delete/{{ task[0] }}', { method: 'DELETE' }).then(() => location.reload())">
    			Delete
			</button>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
